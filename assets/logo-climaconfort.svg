<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" fill="none">
  <g transform="translate(4, 4)">
    <!-- Snowflake/Sun hybrid icon -->
    <circle cx="16" cy="16" r="14" stroke="#0066CC" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="6" fill="#0066CC"/>
    <!-- Snowflake arms -->
    <line x1="16" y1="2" x2="16" y2="10" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="22" x2="16" y2="30" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="9" x2="10" y2="13" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="19" x2="28" y2="23" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="23" x2="10" y2="19" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="13" x2="28" y2="9" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
    <!-- Sun rays -->
    <line x1="16" y1="0" x2="16" y2="3" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="29" x2="16" y2="32" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="8" x2="4.5" y2="9.5" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="27.5" y1="22.5" x2="30" y2="24" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Brand text -->
  <text x="48" y="28" font-family="'Inter', 'Montserrat', sans-serif" font-weight="700" font-size="20" fill="#0066CC">
    Clima<tspan fill="#00B4D8">Confort</tspan>
  </text>
</svg>
